<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>wardrobe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* navigation */

        header {
            height: 70px;
            border-bottom: 1px solid #e5e5e5;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            position: sticky;
            top: 0;
            z-index: 100;

            background: rgba(255, 255, 255, .96);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -.5px;
        }

        nav {
            display: flex;
            gap: 8px;
        }

        nav button {
            border: none;
            background: transparent;
            color: #777;

            padding: 8px 12px;
            border-radius: 8px;

            font-size: 14px;
        }

        nav button:hover {
            background: #f5f5f5;
            color: #111;
        }

        nav button.active {
            background: #111;
            color: #fff;
        }

        /* main */

        main {
            width: min(1100px, 92%);
            margin: auto;
            padding: 45px 0 80px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0 0 8px;

            font-size: 32px;
            font-weight: 600;
            letter-spacing: -1.5px;
        }

        .page-header p {
            margin: 0;
            color: #777;
            font-size: 15px;
        }

        /* buttons */

        .primary-button {
            border: none;
            background: #111;
            color: #fff;

            padding: 11px 17px;
            border-radius: 9px;

            font-size: 14px;
            font-weight: 500;
        }

        .primary-button:hover {
            background: #333;
        }

        .secondary-button {
            border: 1px solid #ddd;
            background: #fff;
            color: #111;

            padding: 10px 16px;
            border-radius: 9px;

            font-size: 14px;
        }

        .secondary-button:hover {
            background: #f7f7f7;
        }

        .danger-button {
            border: 1px solid #e5e5e5;
            background: #fff;
            color: #d11;

            padding: 8px 12px;
            border-radius: 8px;

            font-size: 13px;
        }

        /* wardrobe */

        .upload-area {
            border: 1px dashed #d5d5d5;
            border-radius: 14px;

            padding: 45px 20px;
            text-align: center;

            margin-bottom: 35px;
        }

        .upload-area p {
            color: #777;
            margin: 0 0 18px;
        }

        #file-input {
            display: none;
        }

        .clothing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .clothing-card {
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }

        .clothing-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: contain;
            display: block;
            background: #f7f7f7;
        }

        .clothing-info {
            padding: 12px;
        }

        .clothing-info select {
            width: 100%;

            border: 1px solid #ddd;
            border-radius: 7px;

            padding: 7px 9px;
            background: #fff;

            font-size: 13px;
        }

        .clothing-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .empty-state {
            border: 1px solid #e5e5e5;
            border-radius: 12px;

            padding: 60px 20px;
            text-align: center;

            color: #777;

            grid-column: 1 / -1;
        }

        /* fit builder */

        .builder-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 35px;
            align-items: start;
        }

        .fit-preview {
            border: 1px solid #e5e5e5;
            border-radius: 14px;

            padding: 20px;
            background: #fafafa;
        }

        .fit-preview-title {
            margin: 0 0 20px;
            font-size: 14px;
            color: #777;
        }

        .fit-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /*
            these are now clickable
        */

        .fit-slot {
            background: #fff;

            border: 1px solid #ddd;
            border-radius: 10px;

            overflow: hidden;

            min-height: 180px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            cursor: pointer;

            transition:
                border-color .15s,
                box-shadow .15s,
                transform .15s;
        }

        .fit-slot:hover {
            border-color: #111;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .07);
            transform: translateY(-1px);
        }

        .fit-slot img {
            width: 100%;
            max-height: 350px;

            object-fit: contain;
            display: block;
        }

        .fit-slot-empty {
            color: #aaa;
            font-size: 14px;
        }

        .fit-slot-label {
            position: absolute;

            top: 10px;
            left: 10px;

            padding: 5px 8px;

            background: rgba(255, 255, 255, .92);

            border: 1px solid #e5e5e5;
            border-radius: 6px;

            font-size: 11px;
            color: #777;

            z-index: 2;
        }

        .remove-piece {
            position: absolute;

            top: 9px;
            right: 9px;

            width: 26px;
            height: 26px;

            border: 1px solid #ddd;
            border-radius: 50%;

            background: #fff;

            color: #777;

            z-index: 3;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-piece:hover {
            color: #111;
            border-color: #111;
        }

        .builder-actions {
            border: 1px solid #e5e5e5;
            border-radius: 14px;

            padding: 20px;

            position: sticky;
            top: 95px;
        }

        .builder-actions h2 {
            margin: 0 0 8px;

            font-size: 18px;
            font-weight: 600;
        }

        .builder-actions p {
            margin: 0 0 20px;

            color: #777;
            font-size: 13px;
            line-height: 1.5;
        }

        .builder-buttons {
            display: flex;
            gap: 8px;
        }

        .builder-buttons button {
            flex: 1;
        }

        /* picker */

        .picker-overlay {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, .35);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 500;
        }

        .picker-overlay.open {
            display: flex;
        }

        .picker {
            width: min(700px, 100%);
            max-height: 85vh;

            background: #fff;

            border-radius: 16px;

            overflow: hidden;

            box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
        }

        .picker-header {
            padding: 18px 20px;

            border-bottom: 1px solid #eee;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .picker-header h2 {
            margin: 0;

            font-size: 17px;
            font-weight: 600;
        }

        .close-picker {
            width: 32px;
            height: 32px;

            border: none;
            border-radius: 50%;

            background: #f5f5f5;

            font-size: 18px;
        }

        .picker-content {
            padding: 20px;

            overflow-y: auto;

            max-height: calc(85vh - 70px);
        }

        .picker-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(130px, 1fr));

            gap: 12px;
        }

        .picker-item {
            border: 1px solid #e5e5e5;
            border-radius: 10px;

            overflow: hidden;

            background: #fff;

            cursor: pointer;

            transition: .15s;
        }

        .picker-item:hover {
            border-color: #111;
            transform: translateY(-2px);
        }

        .picker-item img {
            width: 100%;
            aspect-ratio: 1;

            object-fit: contain;

            display: block;

            background: #f7f7f7;
        }

        .picker-item-name {
            padding: 8px;

            font-size: 12px;
            color: #777;
        }

        .picker-empty {
            padding: 40px 10px;

            text-align: center;

            color: #777;
        }

        /* saved fits */

        .saved-fits {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(260px, 1fr));

            gap: 25px;

            align-items: start;
        }

        .saved-fit {
            border: 1px solid #e5e5e5;
            border-radius: 14px;

            overflow: hidden;

            background: #fff;
        }

        .saved-fit-header {
            padding: 14px 15px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #eee;
        }

        .saved-fit-date {
            color: #777;
            font-size: 12px;
        }

        .saved-fit-items {
            display: flex;
            flex-direction: column;
        }

        .saved-fit-item {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #fafafa;

            border-bottom: 1px solid #eee;
        }

        .saved-fit-item:last-child {
            border-bottom: none;
        }

        .saved-fit-item img {
            width: 100%;
            height: 240px;

            object-fit: contain;
            display: block;
        }

        .saved-fit-empty {
            padding: 60px 20px;

            border: 1px solid #e5e5e5;
            border-radius: 14px;

            text-align: center;

            color: #777;

            grid-column: 1 / -1;
        }

        /* mobile */

        @media (max-width: 750px) {

            header {
                height: auto;

                padding: 15px 18px;

                flex-direction: column;
                gap: 12px;
            }

            nav {
                width: 100%;
                justify-content: center;
                overflow-x: auto;
            }

            nav button {
                white-space: nowrap;
            }

            main {
                width: 94%;
                padding-top: 30px;
            }

            .page-header h1 {
                font-size: 27px;
            }

            .builder-layout {
                grid-template-columns: 1fr;
            }

            .builder-actions {
                position: static;
            }

            .saved-fits {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .saved-fit-item img {
                height: 180px;
            }
        }

        @media (max-width: 450px) {

            .saved-fits {
                grid-template-columns: 1fr;
            }

            .saved-fit-item img {
                height: 300px;
            }
        }
    </style>
</head>


<body>

<header>

    <div class="logo">
        wardrobe
    </div>

    <nav>

        <button
            class="nav-button active"
            data-page="wardrobe"
        >
            wardrobe
        </button>

        <button
            class="nav-button"
            data-page="builder"
        >
            build a fit
        </button>

        <button
            class="nav-button"
            data-page="fits"
        >
            my fits
        </button>

    </nav>

</header>


<main>

    <!-- wardrobe -->

    <section
        id="wardrobe"
        class="page active"
    >

        <div class="page-header">

            <h1>wardrobe</h1>

            <p>
                add your clothes and build your digital closet.
            </p>

        </div>


        <div class="upload-area">

            <p>
                add photos of your clothes
            </p>

            <label
                for="file-input"
                class="primary-button"
            >
                add clothing
            </label>

            <input
                id="file-input"
                type="file"
                accept="image/*"
                multiple
            >

        </div>


        <div
            id="clothing-grid"
            class="clothing-grid"
        ></div>

    </section>


    <!-- build a fit -->

    <section
        id="builder"
        class="page"
    >

        <div class="page-header">

            <h1>build a fit</h1>

            <p>
                click a piece to choose what you want to wear.
            </p>

        </div>


        <div class="builder-layout">

            <div class="fit-preview">

                <p class="fit-preview-title">
                    fit preview
                </p>

                <div
                    id="fit-stack"
                    class="fit-stack"
                ></div>

            </div>


            <div class="builder-actions">

                <h2>save your fit</h2>

                <p>
                    click any section of your fit to choose
                    something from your wardrobe.
                </p>

                <div class="builder-buttons">

                    <button
                        id="clear-fit"
                        class="secondary-button"
                    >
                        clear
                    </button>

                    <button
                        id="save-fit"
                        class="primary-button"
                    >
                        save fit
                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- saved fits -->

    <section
        id="fits"
        class="page"
    >

        <div class="page-header">

            <h1>my fits</h1>

            <p>
                your saved outfits.
            </p>

        </div>


        <div
            id="saved-fits"
            class="saved-fits"
        ></div>

    </section>

</main>


<!-- clothing picker -->

<div
    id="picker-overlay"
    class="picker-overlay"
>

    <div class="picker">

        <div class="picker-header">

            <h2 id="picker-title">
                choose a top
            </h2>

            <button
                id="close-picker"
                class="close-picker"
            >
                ×
            </button>

        </div>


        <div class="picker-content">

            <div
                id="picker-grid"
                class="picker-grid"
            ></div>

        </div>

    </div>

</div>


<script>

    /* -----------------------------------------
       data
    ----------------------------------------- */

    let clothes =
        JSON.parse(
            localStorage.getItem("clothes")
        ) || [];

    let savedFits =
        JSON.parse(
            localStorage.getItem("savedFits")
        ) || [];


    const categories = [
        "top",
        "bottom",
        "shoes",
        "outerwear",
        "accessory"
    ];


    let currentPickerCategory = null;


    /* -----------------------------------------
       storage
    ----------------------------------------- */

    function saveData() {

        localStorage.setItem(
            "clothes",
            JSON.stringify(clothes)
        );

        localStorage.setItem(
            "savedFits",
            JSON.stringify(savedFits)
        );

    }


    /* -----------------------------------------
       navigation
    ----------------------------------------- */

    const navButtons =
        document.querySelectorAll(".nav-button");

    const pages =
        document.querySelectorAll(".page");


    navButtons.forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const page =
                    button.dataset.page;


                navButtons.forEach(btn => {
                    btn.classList.remove("active");
                });

                button.classList.add("active");


                pages.forEach(section => {
                    section.classList.remove("active");
                });

                document
                    .getElementById(page)
                    .classList.add("active");


                if (page === "builder") {
                    renderFitPreview();
                }

                if (page === "fits") {
                    renderSavedFits();
                }

            }
        );

    });


    /* -----------------------------------------
       upload
    ----------------------------------------- */

    document
        .getElementById("file-input")
        .addEventListener(
            "change",
            event => {

                const files =
                    Array.from(
                        event.target.files
                    );


                files.forEach(file => {

                    const reader =
                        new FileReader();


                    reader.onload =
                        event => {

                            clothes.push({

                                id:
                                    crypto.randomUUID(),

                                image:
                                    event.target.result,

                                category:
                                    "top"

                            });


                            saveData();

                            renderWardrobe();

                            renderFitPreview();

                        };


                    reader.readAsDataURL(file);

                });


                event.target.value = "";

            }
        );


    /* -----------------------------------------
       wardrobe
    ----------------------------------------- */

    function renderWardrobe() {

        const grid =
            document.getElementById(
                "clothing-grid"
            );


        grid.innerHTML = "";


        if (clothes.length === 0) {

            grid.innerHTML = `

                <div class="empty-state">

                    <p>
                        your wardrobe is empty.
                    </p>

                    <p>
                        add some clothing to get started.
                    </p>

                </div>

            `;

            return;

        }


        clothes.forEach(item => {

            const card =
                document.createElement("div");


            card.className =
                "clothing-card";


            card.innerHTML = `

                <img
                    class="clothing-image"
                    src="${item.image}"
                    alt="${item.category}"
                >

                <div class="clothing-info">

                    <select
                        class="category-select"
                        data-id="${item.id}"
                    >

                        <option
                            value="top"
                            ${item.category === "top" ? "selected" : ""}
                        >
                            top
                        </option>

                        <option
                            value="bottom"
                            ${item.category === "bottom" ? "selected" : ""}
                        >
                            bottom
                        </option>

                        <option
                            value="shoes"
                            ${item.category === "shoes" ? "selected" : ""}
                        >
                            shoes
                        </option>

                        <option
                            value="outerwear"
                            ${item.category === "outerwear" ? "selected" : ""}
                        >
                            outerwear
                        </option>

                        <option
                            value="accessory"
                            ${item.category === "accessory" ? "selected" : ""}
                        >
                            accessory
                        </option>

                    </select>


                    <div class="clothing-actions">

                        <button
                            class="danger-button delete-clothing"
                            data-id="${item.id}"
                        >
                            delete
                        </button>

                    </div>

                </div>

            `;


            grid.appendChild(card);

        });


        document
            .querySelectorAll(".category-select")
            .forEach(select => {

                select.addEventListener(
                    "change",
                    () => {

                        const item =
                            clothes.find(
                                clothing =>
                                    clothing.id ===
                                    select.dataset.id
                            );


                        if (item) {

                            item.category =
                                select.value;

                            saveData();

                            renderFitPreview();

                        }

                    }
                );

            });


        document
            .querySelectorAll(".delete-clothing")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const id =
                            button.dataset.id;


                        clothes =
                            clothes.filter(
                                item =>
                                    item.id !== id
                            );


                        saveData();

                        renderWardrobe();

                        renderFitPreview();

                    }
                );

            });

    }


    /* -----------------------------------------
       fit preview
    ----------------------------------------- */

    function getSelectedItem(category) {

        const stored =
            JSON.parse(
                localStorage.getItem(
                    "currentFit"
                )
            ) || {};


        const id =
            stored[category];


        if (!id) return null;


        return clothes.find(
            item => item.id === id
        ) || null;

    }


    function setSelectedItem(category, id) {

        const current =
            JSON.parse(
                localStorage.getItem(
                    "currentFit"
                )
            ) || {};


        if (id) {
            current[category] = id;
        } else {
            delete current[category];
        }


        localStorage.setItem(
            "currentFit",
            JSON.stringify(current)
        );

    }


    function renderFitPreview() {

        const stack =
            document.getElementById(
                "fit-stack"
            );


        stack.innerHTML = "";


        categories.forEach(category => {

            const slot =
                document.createElement(
                    "div"
                );


            slot.className =
                "fit-slot";


            const item =
                getSelectedItem(category);


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "fit-slot-label";


            label.textContent =
                category;


            slot.appendChild(label);


            if (item) {

                const image =
                    document.createElement(
                        "img"
                    );


                image.src =
                    item.image;


                image.alt =
                    category;


                slot.appendChild(image);


                const remove =
                    document.createElement(
                        "button"
                    );


                remove.className =
                    "remove-piece";


                remove.textContent =
                    "×";


                remove.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        setSelectedItem(
                            category,
                            null
                        );

                        renderFitPreview();

                    }
                );


                slot.appendChild(remove);

            } else {

                const empty =
                    document.createElement(
                        "div"
                    );


                empty.className =
                    "fit-slot-empty";


                empty.textContent =
                    `choose a ${category}`;


                slot.appendChild(empty);

            }


            slot.addEventListener(
                "click",
                () => {

                    openPicker(category);

                }
            );


            stack.appendChild(slot);

        });

    }


    /* -----------------------------------------
       picker
    ----------------------------------------- */

    const pickerOverlay =
        document.getElementById(
            "picker-overlay"
        );


    const pickerGrid =
        document.getElementById(
            "picker-grid"
        );


    const pickerTitle =
        document.getElementById(
            "picker-title"
        );


    function openPicker(category) {

        currentPickerCategory =
            category;


        pickerTitle.textContent =
            `choose a ${category}`;


        pickerGrid.innerHTML = "";


        const options =
            clothes.filter(
                item =>
                    item.category ===
                    category
            );


        if (options.length === 0) {

            pickerGrid.innerHTML = `

                <div class="picker-empty">

                    <p>
                        you don't have any
                        ${category}s yet.
                    </p>

                    <p>
                        add one to your wardrobe first.
                    </p>

                </div>

            `;

        } else {

            options.forEach(item => {

                const option =
                    document.createElement(
                        "div"
                    );


                option.className =
                    "picker-item";


                option.innerHTML = `

                    <img
                        src="${item.image}"
                        alt="${category}"
                    >

                    <div class="picker-item-name">
                        choose this ${category}
                    </div>

                `;


                option.addEventListener(
                    "click",
                    () => {

                        setSelectedItem(
                            currentPickerCategory,
                            item.id
                        );


                        closePicker();

                        renderFitPreview();

                    }
                );


                pickerGrid.appendChild(
                    option
                );

            });

        }


        pickerOverlay.classList.add(
            "open"
        );

    }


    function closePicker() {

        pickerOverlay.classList.remove(
            "open"
        );

        currentPickerCategory =
            null;

    }


    document
        .getElementById("close-picker")
        .addEventListener(
            "click",
            closePicker
        );


    pickerOverlay.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                pickerOverlay
            ) {

                closePicker();

            }

        }
    );


    /* -----------------------------------------
       clear fit
    ----------------------------------------- */

    document
        .getElementById("clear-fit")
        .addEventListener(
            "click",
            () => {

                localStorage.removeItem(
                    "currentFit"
                );

                renderFitPreview();

            }
        );


    /* -----------------------------------------
       save fit
    ----------------------------------------- */

    document
        .getElementById("save-fit")
        .addEventListener(
            "click",
            () => {

                const current =
                    JSON.parse(
                        localStorage.getItem(
                            "currentFit"
                        )
                    ) || {};


                const items =
                    categories
                        .map(
                            category =>
                                clothes.find(
                                    item =>
                                        item.id ===
                                        current[category]
                                )
                        )
                        .filter(Boolean);


                if (items.length === 0) {

                    alert(
                        "choose at least one piece first."
                    );

                    return;

                }


                savedFits.unshift({

                    id:
                        crypto.randomUUID(),

                    createdAt:
                        new Date().toISOString(),

                    items:
                        items.map(item => ({
                            id: item.id,
                            image: item.image,
                            category: item.category
                        }))

                });


                saveData();

                alert(
                    "fit saved."
                );

            }
        );


    /* -----------------------------------------
       saved fits
    ----------------------------------------- */

    function renderSavedFits() {

        const container =
            document.getElementById(
                "saved-fits"
            );


        container.innerHTML = "";


        if (savedFits.length === 0) {

            container.innerHTML = `

                <div class="saved-fit-empty">

                    <p>
                        you haven't saved any fits yet.
                    </p>

                    <p>
                        build a fit and save it here.
                    </p>

                </div>

            `;

            return;

        }


        savedFits.forEach(fit => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "saved-fit";


            const date =
                new Date(
                    fit.createdAt
                );


            const formattedDate =
                date.toLocaleDateString(
                    undefined,
                    {
                        year: "numeric",
                        month: "short",
                        day: "numeric"
                    }
                );


            card.innerHTML = `

                <div class="saved-fit-header">

                    <span class="saved-fit-date">
                        ${formattedDate}
                    </span>

                    <button
                        class="danger-button delete-fit"
                    >
                        delete
                    </button>

                </div>


                <div class="saved-fit-items">

                    ${fit.items.map(item => `

                        <div
                            class="saved-fit-item"
                        >

                            <img
                                src="${item.image}"
                                alt="${item.category}"
                            >

                        </div>

                    `).join("")}

                </div>

            `;


            card
                .querySelector(".delete-fit")
                .addEventListener(
                    "click",
                    () => {

                        savedFits =
                            savedFits.filter(
                                saved =>
                                    saved.id !==
                                    fit.id
                            );


                        saveData();

                        renderSavedFits();

                    }
                );


            container.appendChild(card);

        });

    }


    /* -----------------------------------------
       initial load
    ----------------------------------------- */

    renderWardrobe();

    renderFitPreview();

</script>

</body>
</html>
