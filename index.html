<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>wardrobe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        select,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* ---------------- navigation ---------------- */

        header {
            height: 70px;
            border-bottom: 1px solid #e5e5e5;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            position: sticky;
            top: 0;

            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);

            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 8px;
        }

        nav button {
            border: none;
            background: transparent;
            color: #777;

            padding: 8px 12px;
            border-radius: 8px;

            font-size: 14px;
        }

        nav button:hover {
            background: #f5f5f5;
            color: #111;
        }

        nav button.active {
            background: #111;
            color: white;
        }

        /* ---------------- main ---------------- */

        main {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 45px 0 80px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -1.5px;
        }

        .page-header p {
            margin: 0;
            color: #777;
            font-size: 15px;
        }

        /* ---------------- buttons ---------------- */

        .primary-button {
            border: none;
            background: #111;
            color: white;

            padding: 11px 17px;
            border-radius: 9px;

            font-size: 14px;
            font-weight: 500;
        }

        .primary-button:hover {
            background: #333;
        }

        .secondary-button {
            border: 1px solid #ddd;
            background: white;
            color: #111;

            padding: 10px 16px;
            border-radius: 9px;

            font-size: 14px;
        }

        .secondary-button:hover {
            background: #f7f7f7;
        }

        .danger-button {
            border: 1px solid #e5e5e5;
            background: white;
            color: #d11;

            padding: 8px 12px;
            border-radius: 8px;

            font-size: 13px;
        }

        /* ---------------- wardrobe ---------------- */

        .upload-area {
            border: 1px dashed #d5d5d5;
            border-radius: 14px;

            padding: 45px 20px;
            text-align: center;

            margin-bottom: 35px;
        }

        .upload-area p {
            color: #777;
            margin: 0 0 18px;
        }

        #file-input {
            display: none;
        }

        .clothing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .clothing-card {
            border: 1px solid #e5e5e5;
            border-radius: 12px;

            overflow: hidden;
            background: white;
        }

        .clothing-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: contain;

            display: block;

            background: #f7f7f7;
        }

        .clothing-info {
            padding: 12px;
        }

        .clothing-info select {
            width: 100%;

            border: 1px solid #ddd;
            border-radius: 7px;

            padding: 7px 9px;
            background: white;

            font-size: 13px;
        }

        .clothing-actions {
            display: flex;
            justify-content: flex-end;

            margin-top: 10px;
        }

        .empty-state {
            border: 1px solid #e5e5e5;
            border-radius: 12px;

            padding: 60px 20px;
            text-align: center;

            color: #777;

            grid-column: 1 / -1;
        }

        /* ---------------- fit builder ---------------- */

        .builder-layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 40px;
            align-items: start;
        }

        .fit-preview {
            border: 1px solid #e5e5e5;
            border-radius: 14px;

            padding: 20px;

            background: #fafafa;
        }

        .fit-preview-title {
            margin: 0 0 20px;

            font-size: 14px;
            color: #777;
        }

        .fit-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .fit-slot {
            background: white;

            border: 1px solid #e5e5e5;
            border-radius: 10px;

            overflow: hidden;

            min-height: 120px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .fit-slot img {
            width: 100%;
            max-height: 300px;

            object-fit: contain;
            display: block;
        }

        .fit-slot-empty {
            color: #aaa;
            font-size: 14px;
        }

        .fit-slot-label {
            position: absolute;

            top: 10px;
            left: 10px;

            padding: 5px 8px;

            background: rgba(255, 255, 255, 0.9);

            border: 1px solid #e5e5e5;
            border-radius: 6px;

            font-size: 11px;
            color: #777;

            z-index: 2;
        }

        .builder-controls {
            border: 1px solid #e5e5e5;
            border-radius: 14px;

            padding: 20px;

            position: sticky;
            top: 95px;
        }

        .builder-controls h2 {
            margin: 0 0 20px;

            font-size: 18px;
            font-weight: 600;
        }

        .category-control {
            margin-bottom: 15px;
        }

        .category-control label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            color: #555;
        }

        .category-control select {
            width: 100%;

            border: 1px solid #ddd;
            border-radius: 8px;

            padding: 10px;

            background: white;
        }

        .builder-actions {
            border-top: 1px solid #eee;

            margin-top: 20px;
            padding-top: 20px;

            display: flex;
            gap: 8px;
        }

        .builder-actions button {
            flex: 1;
        }

        /* ---------------- saved fits ---------------- */

        .saved-fits {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .saved-fit {
            border: 1px solid #e5e5e5;
            border-radius: 14px;

            overflow: hidden;

            background: white;
        }

        .saved-fit-header {
            padding: 16px 18px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #eee;
        }

        .saved-fit-date {
            color: #777;
            font-size: 13px;
        }

        .saved-fit-items {
            display: flex;
            flex-direction: column;
        }

        .saved-fit-item {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #fafafa;

            border-bottom: 1px solid #eee;
        }

        .saved-fit-item:last-child {
            border-bottom: none;
        }

        .saved-fit-item img {
            width: 100%;
            max-height: 500px;

            object-fit: contain;
            display: block;
        }

        .saved-fit-empty {
            padding: 60px 20px;

            border: 1px solid #e5e5e5;
            border-radius: 14px;

            text-align: center;
            color: #777;
        }

        /* ---------------- mobile ---------------- */

        @media (max-width: 750px) {

            header {
                height: auto;

                padding: 15px 18px;

                flex-direction: column;
                gap: 12px;
            }

            nav {
                width: 100%;
                justify-content: center;
                overflow-x: auto;
            }

            nav button {
                white-space: nowrap;
            }

            main {
                width: 94%;
                padding-top: 30px;
            }

            .page-header h1 {
                font-size: 27px;
            }

            .builder-layout {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .builder-controls {
                position: static;
            }

            .fit-slot img {
                max-height: 350px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        wardrobe
    </div>

    <nav>

        <button
            class="nav-button active"
            data-page="wardrobe"
        >
            wardrobe
        </button>

        <button
            class="nav-button"
            data-page="builder"
        >
            build a fit
        </button>

        <button
            class="nav-button"
            data-page="fits"
        >
            my fits
        </button>

    </nav>

</header>


<main>

    <!-- wardrobe -->

    <section
        id="wardrobe"
        class="page active"
    >

        <div class="page-header">

            <h1>wardrobe</h1>

            <p>
                add your clothes and build your digital closet.
            </p>

        </div>


        <div class="upload-area">

            <p>
                add photos of your clothes
            </p>

            <label
                for="file-input"
                class="primary-button"
            >
                add clothing
            </label>

            <input
                id="file-input"
                type="file"
                accept="image/*"
                multiple
            >

        </div>


        <div
            id="clothing-grid"
            class="clothing-grid"
        ></div>

    </section>


    <!-- build a fit -->

    <section
        id="builder"
        class="page"
    >

        <div class="page-header">

            <h1>build a fit</h1>

            <p>
                choose exactly what you want to wear.
            </p>

        </div>


        <div class="builder-layout">

            <div class="fit-preview">

                <p class="fit-preview-title">
                    fit preview
                </p>

                <div
                    id="fit-stack"
                    class="fit-stack"
                ></div>

            </div>


            <div class="builder-controls">

                <h2>choose your pieces</h2>


                <div class="category-control">

                    <label for="top-select">
                        top
                    </label>

                    <select id="top-select">
                        <option value="">
                            none
                        </option>
                    </select>

                </div>


                <div class="category-control">

                    <label for="bottom-select">
                        bottom
                    </label>

                    <select id="bottom-select">
                        <option value="">
                            none
                        </option>
                    </select>

                </div>


                <div class="category-control">

                    <label for="shoes-select">
                        shoes
                    </label>

                    <select id="shoes-select">
                        <option value="">
                            none
                        </option>
                    </select>

                </div>


                <div class="category-control">

                    <label for="outerwear-select">
                        outerwear
                    </label>

                    <select id="outerwear-select">
                        <option value="">
                            none
                        </option>
                    </select>

                </div>


                <div class="category-control">

                    <label for="accessory-select">
                        accessory
                    </label>

                    <select id="accessory-select">
                        <option value="">
                            none
                        </option>
                    </select>

                </div>


                <div class="builder-actions">

                    <button
                        id="clear-fit"
                        class="secondary-button"
                    >
                        clear
                    </button>

                    <button
                        id="save-fit"
                        class="primary-button"
                    >
                        save fit
                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- saved fits -->

    <section
        id="fits"
        class="page"
    >

        <div class="page-header">

            <h1>my fits</h1>

            <p>
                your saved outfits.
            </p>

        </div>


        <div
            id="saved-fits"
            class="saved-fits"
        ></div>

    </section>

</main>


<script>

    /* -----------------------------------------
       data
    ----------------------------------------- */

    let clothes =
        JSON.parse(
            localStorage.getItem("clothes")
        ) || [];

    let savedFits =
        JSON.parse(
            localStorage.getItem("savedFits")
        ) || [];


    const categories = [
        "top",
        "bottom",
        "shoes",
        "outerwear",
        "accessory"
    ];


    /* -----------------------------------------
       local storage
    ----------------------------------------- */

    function saveData() {

        localStorage.setItem(
            "clothes",
            JSON.stringify(clothes)
        );

        localStorage.setItem(
            "savedFits",
            JSON.stringify(savedFits)
        );

    }


    /* -----------------------------------------
       navigation
    ----------------------------------------- */

    const navButtons =
        document.querySelectorAll(".nav-button");

    const pages =
        document.querySelectorAll(".page");


    navButtons.forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const page =
                    button.dataset.page;


                navButtons.forEach(btn => {
                    btn.classList.remove("active");
                });

                button.classList.add("active");


                pages.forEach(section => {
                    section.classList.remove("active");
                });

                document
                    .getElementById(page)
                    .classList.add("active");


                if (page === "builder") {
                    updateBuilder();
                }

                if (page === "fits") {
                    renderSavedFits();
                }

            }
        );

    });


    /* -----------------------------------------
       upload clothing
    ----------------------------------------- */

    const fileInput =
        document.getElementById("file-input");


    fileInput.addEventListener(
        "change",
        event => {

            const files =
                Array.from(event.target.files);


            files.forEach(file => {

                const reader =
                    new FileReader();


                reader.onload = event => {

                    clothes.push({

                        id:
                            crypto.randomUUID(),

                        image:
                            event.target.result,

                        category:
                            "top"

                    });


                    saveData();

                    renderWardrobe();

                    updateBuilder();

                };


                reader.readAsDataURL(file);

            });


            fileInput.value = "";

        }
    );


    /* -----------------------------------------
       render wardrobe
    ----------------------------------------- */

    function renderWardrobe() {

        const grid =
            document.getElementById(
                "clothing-grid"
            );


        grid.innerHTML = "";


        if (clothes.length === 0) {

            grid.innerHTML = `

                <div class="empty-state">

                    <p>
                        your wardrobe is empty.
                    </p>

                    <p>
                        add some clothing to get started.
                    </p>

                </div>

            `;

            return;

        }


        clothes.forEach(item => {

            const card =
                document.createElement("div");


            card.className =
                "clothing-card";


            card.innerHTML = `

                <img
                    class="clothing-image"
                    src="${item.image}"
                    alt="${item.category}"
                >

                <div class="clothing-info">

                    <select
                        class="category-select"
                        data-id="${item.id}"
                    >

                        <option
                            value="top"
                            ${item.category === "top" ? "selected" : ""}
                        >
                            top
                        </option>

                        <option
                            value="bottom"
                            ${item.category === "bottom" ? "selected" : ""}
                        >
                            bottom
                        </option>

                        <option
                            value="shoes"
                            ${item.category === "shoes" ? "selected" : ""}
                        >
                            shoes
                        </option>

                        <option
                            value="outerwear"
                            ${item.category === "outerwear" ? "selected" : ""}
                        >
                            outerwear
                        </option>

                        <option
                            value="accessory"
                            ${item.category === "accessory" ? "selected" : ""}
                        >
                            accessory
                        </option>

                    </select>


                    <div class="clothing-actions">

                        <button
                            class="danger-button delete-clothing"
                            data-id="${item.id}"
                        >
                            delete
                        </button>

                    </div>

                </div>

            `;


            grid.appendChild(card);

        });


        /* category changes */

        document
            .querySelectorAll(".category-select")
            .forEach(select => {

                select.addEventListener(
                    "change",
                    () => {

                        const item =
                            clothes.find(
                                clothing =>
                                    clothing.id ===
                                    select.dataset.id
                            );


                        if (item) {

                            item.category =
                                select.value;

                            saveData();

                            updateBuilder();

                        }

                    }
                );

            });


        /* delete buttons */

        document
            .querySelectorAll(".delete-clothing")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const id =
                            button.dataset.id;


                        clothes =
                            clothes.filter(
                                item =>
                                    item.id !== id
                            );


                        saveData();

                        renderWardrobe();

                        updateBuilder();

                    }
                );

            });

    }


    /* -----------------------------------------
       fit builder
    ----------------------------------------- */

    function updateBuilder() {

        categories.forEach(category => {

            const select =
                document.getElementById(
                    `${category}-select`
                );


            if (!select) return;


            const currentValue =
                select.value;


            select.innerHTML = `

                <option value="">
                    none
                </option>

            `;


            clothes
                .filter(
                    item =>
                        item.category === category
                )
                .forEach(item => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        item.id;


                    option.textContent =
                        `${category} · ${shortId(item.id)}`;


                    select.appendChild(option);

                });


            if (
                clothes.some(
                    item =>
                        item.id === currentValue &&
                        item.category === category
                )
            ) {

                select.value =
                    currentValue;

            }

        });


        renderFitPreview();

    }


    function shortId(id) {

        return String(id).slice(0, 6);

    }


    /* -----------------------------------------
       fit preview
    ----------------------------------------- */

    function getSelectedItems() {

        const selected = [];


        categories.forEach(category => {

            const select =
                document.getElementById(
                    `${category}-select`
                );


            if (!select || !select.value) {
                return;
            }


            const item =
                clothes.find(
                    clothing =>
                        clothing.id ===
                        select.value
                );


            if (item) {
                selected.push(item);
            }

        });


        return selected;

    }


    function renderFitPreview() {

        const stack =
            document.getElementById(
                "fit-stack"
            );


        stack.innerHTML = "";


        categories.forEach(category => {

            const select =
                document.getElementById(
                    `${category}-select`
                );


            if (!select) return;


            const slot =
                document.createElement(
                    "div"
                );


            slot.className =
                "fit-slot";


            const item =
                clothes.find(
                    clothing =>
                        clothing.id ===
                        select.value
                );


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "fit-slot-label";


            label.textContent =
                category;


            slot.appendChild(label);


            if (item) {

                const image =
                    document.createElement(
                        "img"
                    );


                image.src =
                    item.image;


                image.alt =
                    category;


                slot.appendChild(image);

            } else {

                const empty =
                    document.createElement(
                        "div"
                    );


                empty.className =
                    "fit-slot-empty";


                empty.textContent =
                    `choose ${category}`;


                slot.appendChild(empty);

            }


            stack.appendChild(slot);

        });

    }


    /* -----------------------------------------
       builder changes
    ----------------------------------------- */

    categories.forEach(category => {

        const select =
            document.getElementById(
                `${category}-select`
            );


        select.addEventListener(
            "change",
            renderFitPreview
        );

    });


    /* -----------------------------------------
       clear fit
    ----------------------------------------- */

    document
        .getElementById("clear-fit")
        .addEventListener(
            "click",
            () => {

                categories.forEach(category => {

                    document
                        .getElementById(
                            `${category}-select`
                        )
                        .value = "";

                });


                renderFitPreview();

            }
        );


    /* -----------------------------------------
       save fit
    ----------------------------------------- */

    document
        .getElementById("save-fit")
        .addEventListener(
            "click",
            () => {

                const items =
                    getSelectedItems();


                if (items.length === 0) {

                    alert(
                        "choose at least one piece first."
                    );

                    return;

                }


                const fit = {

                    id:
                        crypto.randomUUID(),

                    createdAt:
                        new Date().toISOString(),

                    items:
                        items.map(item => ({
                            id: item.id,
                            image: item.image,
                            category: item.category
                        }))

                };


                savedFits.unshift(fit);

                saveData();

                alert("fit saved.");

            }
        );


    /* -----------------------------------------
       render saved fits
    ----------------------------------------- */

    function renderSavedFits() {

        const container =
            document.getElementById(
                "saved-fits"
            );


        container.innerHTML = "";


        if (savedFits.length === 0) {

            container.innerHTML = `

                <div class="saved-fit-empty">

                    <p>
                        you haven't saved any fits yet.
                    </p>

                    <p>
                        build a fit and save it here.
                    </p>

                </div>

            `;

            return;

        }


        savedFits.forEach(fit => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "saved-fit";


            const date =
                new Date(
                    fit.createdAt
                );


            const formattedDate =
                date.toLocaleDateString(
                    undefined,
                    {
                        year: "numeric",
                        month: "short",
                        day: "numeric"
                    }
                );


            card.innerHTML = `

                <div class="saved-fit-header">

                    <span class="saved-fit-date">
                        ${formattedDate}
                    </span>

                    <button
                        class="danger-button"
                        data-fit-id="${fit.id}"
                    >
                        delete
                    </button>

                </div>


                <div class="saved-fit-items">

                    ${fit.items.map(item => `

                        <div
                            class="saved-fit-item"
                        >

                            <img
                                src="${item.image}"
                                alt="${item.category}"
                            >

                        </div>

                    `).join("")}

                </div>

            `;


            container.appendChild(card);

        });


        container
            .querySelectorAll(
                "[data-fit-id]"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const id =
                            button.dataset.fitId;


                        savedFits =
                            savedFits.filter(
                                fit =>
                                    fit.id !== id
                            );


                        saveData();

                        renderSavedFits();

                    }
                );

            });

    }


    /* -----------------------------------------
       initial setup
    ----------------------------------------- */

    renderWardrobe();

    updateBuilder();

</script>

</body>
</html>
